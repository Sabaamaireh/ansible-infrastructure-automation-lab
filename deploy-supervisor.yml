---
- name: Deploy and manage Node.js applications
  hosts: app_servers
  become: true

  tasks:
    - name: Install Node.js and npm
      ansible.builtin.apt:
        name:
          - nodejs
          - npm
        state: present
        update_cache: true
        cache_valid_time: 3600
    - name: Install Supervisor
      ansible.builtin.apt:
        name: supervisor
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Ensure application directory exists
      ansible.builtin.file:
        path: /opt/myapp
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Deploy application files
      ansible.builtin.copy:
        src: "{{ 'files/appserver1/' if inventory_hostname == 'app-server1' else 'files/appserver2/' }}"
        dest: /opt/myapp/
        owner: root
        group: root
        mode: '0644'

    - name: Install application dependencies
      community.general.npm:
        path: /opt/myapp
        state: present

    - name: Configure application in Supervisor
      ansible.builtin.copy:
        dest: /etc/supervisor/conf.d/myapp.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          [program:myapp]
          command=/usr/bin/node /opt/myapp/index.js
          directory=/opt/myapp
          user=www-data
          autostart=true
          autorestart=true
          startsecs=3
          stopsignal=TERM
          stdout_logfile=/var/log/myapp.log
          stderr_logfile=/var/log/myapp-error.log

    - name: Check whether Supervisor is running
      ansible.builtin.command: pgrep -x supervisord
      register: supervisord_process
      changed_when: false
      failed_when: false

    - name: Start Supervisor when needed
      ansible.builtin.command: /usr/bin/supervisord -c /etc/supervisor/supervisord.conf
      when: supervisord_process.rc != 0

    - name: Reread Supervisor configuration
      ansible.builtin.command: supervisorctl reread
      register: supervisor_reread
      changed_when: "'available' in supervisor_reread.stdout or 'changed' in supervisor_reread.stdout"

    - name: Apply Supervisor configuration
      ansible.builtin.command: supervisorctl update
      register: supervisor_update
      changed_when: "'added process group' in supervisor_update.stdout or 'restarted' in supervisor_update.stdout or 'removed process group' in supervisor_update.stdout"

    - name: Check application status
      ansible.builtin.command: supervisorctl status myapp
      register: app_status
      changed_when: false
      failed_when: false

    - name: Start application if stopped
      ansible.builtin.command: supervisorctl start myapp
      when: app_status.rc != 0 or 'STOPPED' in app_status.stdout or 'EXITED' in app_status.stdout or 'FATAL' in app_status.stdout

    - name: Wait until application is running
      ansible.builtin.command: supervisorctl status myapp
      register: app_status
      changed_when: false
      retries: 5
      delay: 2
      until: "'RUNNING' in app_status.stdout"
